name: refresh stats
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:          # Allows manual trigger from GitHub UI
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py
      - name: Commit and Push changes
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg"
          # Check if there are changes to these files. If not, exit silently.
          if [ -n "$(git status --porcelain -- $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $FILES
            git commit -m "stats: refresh"
            git push
          fi
